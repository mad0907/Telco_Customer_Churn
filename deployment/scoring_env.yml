# Conda environment for the managed online deployment (score.py).
# Pinned deliberately -- an unpinned scoring environment is a common
# source of train/serve skew when the training environment drifts ahead
# of it silently.
name: telco-churn-scoring-env
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - mlflow==2.14.1
      - pandas==2.3.3
      - numpy==2.5.2
      - scikit-learn==1.9.0
      - xgboost==3.4.0
      - azureml-inference-server-http==1.3.1
      - azure-keyvault-secrets==4.8.0
      - azure-identity==1.17.1
      - azure-confidentialledger==1.2.0
